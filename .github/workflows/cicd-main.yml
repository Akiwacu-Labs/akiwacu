# Pipeline CI/CD — branche main → vm-prod-g1
# Implémente la séquence exigée par l'énoncé §11.3.
# Identique au pipeline develop, avec deux différences :
#   - cible vm-prod-g1
#   - seuil Trivy plus strict (CRITICAL,HIGH) et environnement protégé
#
# Astuce : configure l'environnement GitHub "production" avec un "required
# reviewer" (toi, M1). Le déploiement PROD demandera alors une approbation
# manuelle — c'est une bonne pratique à mentionner au rapport, et ça évite
# un déploiement accidentel la veille de la soutenance.

name: CI/CD main → vm-prod-g1

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api
  JAVA_VERSION: '21'

concurrency:
  group: production
  cancel-in-progress: false

jobs:

  build-test-quality:
    name: Build, tests, couverture et qualité
    runs-on: [self-hosted, linux, onprem]
    outputs:
      version: ${{ steps.version.outputs.version }}

    # MONOREPO : le pom.xml est dans api/, pas à la racine
    defaults:
      run:
        working-directory: api

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installation de Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compilation complète du projet Maven
        run: ./mvnw -B clean compile

      - name: Exécution de l'ensemble des tests unitaires
        run: ./mvnw -B test

      - name: Génération du rapport de couverture (JaCoCo)
        run: ./mvnw -B jacoco:report

      # Le seuil bloquant s'active quand la variable COVERAGE_GATE passe à true.
      # Tant que le socle n'est pas mergé, il n'y a rien à couvrir : le seuil
      # ferait échouer la toute première PR, celle qui apporte le code.
      #   gh variable set COVERAGE_GATE --body true
      - name: Vérification du seuil de couverture
        if: vars.COVERAGE_GATE == 'true'
        run: ./mvnw -B jacoco:check

      - name: Publication du rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-prod
          path: api/target/site/jacoco/
          retention-days: 90

      # SonarQube tourne sur vm-devops-g1 et n'existe pas au D1.
      # Klein bascule la variable une fois le serveur en ligne :
      #   gh variable set SONAR_ENABLED --body true
      - name: Analyse de la qualité du code (SonarQube)
        if: vars.SONAR_ENABLED == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          ./mvnw -B sonar:sonar \
            -Dsonar.projectKey=akiwacu \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Validation du Quality Gate SonarQube
        if: vars.SONAR_ENABLED == 'true'
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Calcul de la version d'image
        id: version
        run: echo "version=$(date +%Y%m%d)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  docker-build-scan-push:
    name: Image Docker, analyse Trivy et publication GHCR
    needs: build-test-quality
    runs-on: [self-hosted, linux, onprem]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Construction de l'image Docker
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-test-quality.outputs.version }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ./api

      - name: Analyse de sécurité de l'image (Trivy) — seuil production
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Export du rapport Trivy (livrable)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'json'
          output: 'trivy-report-prod.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Publication du rapport Trivy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-prod
          path: trivy-report-prod.json
          retention-days: 90

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication de l'image sur GHCR
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-test-quality.outputs.version }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # ─────────────────────────────────────────────────────────────
  # 2 bis. Image du client React
  # ─────────────────────────────────────────────────────────────
  client-build-push:
    name: Build et publication du client React
    needs: build-test-quality
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, onprem]
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installation et build du client
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      - name: Construction de l'image du client
        working-directory: .
        run: docker build -t ${{ env.REGISTRY }}/${{ github.repository }}/client:latest ./client

      - name: Analyse de sécurité de l'image client (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/client:latest
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication de l'image client
        working-directory: .
        run: docker push ${{ env.REGISTRY }}/${{ github.repository }}/client:latest

  deploy-vm-prod:
    name: Déploiement automatique sur vm-prod-g1
    needs: [build-test-quality, docker-build-scan-push, client-build-push]
    runs-on: [self-hosted, linux, onprem]
    environment: production          # ← ajoute un required reviewer dans les settings

    steps:
      - uses: actions/checkout@v4

      - name: Chargement de la clé SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY_PROD }}

      - name: Ajout de vm-prod-g1 aux hôtes connus
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST_PROD }} >> ~/.ssh/known_hosts

      - name: Sauvegarde de la base avant déploiement
        run: |
          ssh ${{ secrets.SSH_USER_PROD }}@${{ secrets.SSH_HOST_PROD }} << 'EOF'
            set -e
            mkdir -p ~/backups
            docker exec akiwacu-db pg_dump -U akiwacu akiwacu \
              > ~/backups/akiwacu-$(date +%Y%m%d-%H%M%S).sql || true
            ls -t ~/backups/*.sql | tail -n +6 | xargs -r rm
          EOF

      - name: Copie du docker-compose
        run: |
          scp docker-compose.prod.yml \
            ${{ secrets.SSH_USER_PROD }}@${{ secrets.SSH_HOST_PROD }}:~/akiwacu/docker-compose.yml

      - name: Déploiement de l'application
        run: |
          ssh ${{ secrets.SSH_USER_PROD }}@${{ secrets.SSH_HOST_PROD }} << 'EOF'
            set -e
            cd ~/akiwacu
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD_PROD }}'
            export JWT_SECRET='${{ secrets.JWT_SECRET_PROD }}'
            export IMAGE_TAG='${{ needs.build-test-quality.outputs.version }}'
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
          EOF

      - name: Vérification du bon démarrage de l'application
        run: |
          echo "Attente du démarrage (max 120 s)…"
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://${{ secrets.SSH_HOST_PROD }}:8080/actuator/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Application démarrée et saine sur vm-prod-g1"
              exit 0
            fi
            echo "  tentative $i/24 — statut $STATUS"
            sleep 5
          done
          echo "❌ Échec du démarrage — rollback recommandé"
          ssh ${{ secrets.SSH_USER_PROD }}@${{ secrets.SSH_HOST_PROD }} \
            'cd ~/akiwacu && docker compose logs --tail=100 api'
          exit 1
