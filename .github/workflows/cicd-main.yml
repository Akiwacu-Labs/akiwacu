# Pipeline CI/CD — branche main → vm-prod-g1
# Implémente exactement la séquence exigée par l'énoncé §11.3.
# Toute étape en échec interrompt le pipeline : le déploiement n'a lieu
# que si TOUTES les étapes précédentes sont validées.
#
# ─────────────────────────────────────────────────────────────────────
# DEUX RÉGLAGES PROPRES AU RUNNER AUTO-HÉBERGÉ
#
# 1. L'OUTILLAGE EST PRÉ-INSTALLÉ SUR LA VM (JDK 21, Node 20, jq).
#    actions/setup-java télécharge un JDK d'environ 180 Mo À CHAQUE exécution ;
#    setup-node fait de même avec Node. Un runner GitHub part d'une image dont
#    le cache d'outils est déjà chaud — le nôtre est une machine persistante :
#    on installe une fois, on vérifie ensuite.
#
# 2. TRIVY TOURNE EN CONTENEUR, base de vulnérabilités AMORCÉE SUR LA VM.
#    trivy-action retélécharge son binaire (~50 Mo) à chaque exécution, et
#    Trivy lui-même retélécharge sa base (107 Mo) dès qu'elle a plus de 24 h.
#    À 60 Ko/s, 107 Mo demandent une demi-heure : Trivy abandonne à 5 minutes.
#    La base est donc amorcée hors CI, une fois, et le job tourne avec
#    --skip-db-update. Refresh hebdomadaire, voir docs/RUNBOOK-TRIVY.md.
#    --pkg-types os : on n'analyse que les paquets système. L'analyse des
#    dépendances Java exigerait la trivy-java-db (~700 Mo), hors de portée
#    de cette liaison. Limitation assumée, voir DECISIONS.md D-30.
#
# Le reste utilise les actions standard. Le problème initial — expiration au
# bout de 100 s sur codeload.github.com — venait du contrôle de congestion TCP
# de la VM, pas de la bande passante : 16 Ko/s avant réglage, 49 Ko/s après
# activation de BBR et élargissement des fenêtres. Voir
# docs/ADR-002-RUNNER-AUTO-HEBERGE.md.
# ─────────────────────────────────────────────────────────────────────

name: CI/CD main → vm-prod-g1

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api
  JAVA_VERSION: '21'
  TRIVY_CACHE: /home/runner/.trivy-cache

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false      # on n'annule jamais un déploiement de production

jobs:

  # ─────────────────────────────────────────────────────────────
  # 1. Build · tests · couverture · qualité
  # ─────────────────────────────────────────────────────────────
  build-test-quality:
    name: Build, tests, couverture et qualité
    runs-on: [self-hosted, linux, onprem]
    outputs:
      version: ${{ steps.version.outputs.version }}

    # MONOREPO : le pom.xml est dans api/, pas à la racine
    defaults:
      run:
        working-directory: api

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # requis par SonarQube pour la blame

      # Pré-installé sur vm-devops-g1 : sudo apt install -y openjdk-21-jdk
      - name: Vérification de l'outillage
        run: |
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-(défini par le paquet système)}"

      - name: Compilation complète du projet Maven
        run: ./mvnw -B clean compile

      - name: Exécution de l'ensemble des tests unitaires
        run: ./mvnw -B test

      - name: Génération du rapport de couverture (JaCoCo)
        run: ./mvnw -B jacoco:report

      # Le seuil bloquant s'active quand la variable COVERAGE_GATE passe à true.
      # Tant que le socle n'est pas mergé, il n'y a rien à couvrir : le seuil
      # ferait échouer la toute première PR, celle qui apporte le code.
      #   gh variable set COVERAGE_GATE --body true
      - name: Vérification du seuil de couverture
        if: vars.COVERAGE_GATE == 'true'
        run: ./mvnw -B jacoco:check

      # PAS actions/upload-artifact : le runner purge _actions/ à CHAQUE job,
      # donc l'action serait retéléchargée (2,2 Mo) à chaque exécution, avec un
      # délai de 100 s sur une liaison qui descend parfois à 16 Ko/s.
      # Les artefacts vivent sur la VM, qui est persistante.
      # Récupération au D7 : scp -r deployer@192.168.0.52:/home/runner/akiwacu-artifacts .
      - name: Archivage du rapport de couverture
        if: always()
        working-directory: .
        run: |
          DEST="/home/runner/akiwacu-artifacts/run-${GITHUB_RUN_NUMBER}/jacoco"
          mkdir -p "$DEST"
          cp -r api/target/site/jacoco/. "$DEST"/ 2>/dev/null || echo "aucun rapport"
          ln -sfn "/home/runner/akiwacu-artifacts/run-${GITHUB_RUN_NUMBER}" /home/runner/akiwacu-artifacts/derniere
          echo "JaCoCo → $DEST"

      # SonarQube tourne sur vm-devops-g1 et n'existe pas au D1.
      #   gh variable set SONAR_ENABLED --body true
      - name: Analyse de la qualité du code (SonarQube)
        if: vars.SONAR_ENABLED == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          ./mvnw -B sonar:sonar \
            -Dsonar.projectKey=akiwacu \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Validation du Quality Gate SonarQube
        if: vars.SONAR_ENABLED == 'true'
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Calcul de la version d'image
        id: version
        run: echo "version=$(date +%Y%m%d)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────
  # 2. Image Docker · sécurité · publication
  # ─────────────────────────────────────────────────────────────
  docker-build-scan-push:
    name: Image Docker, analyse Trivy et publication GHCR
    needs: build-test-quality
    runs-on: [self-hosted, linux, onprem]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # GHCR n'accepte que des minuscules et l'organisation s'écrit « Akiwacu-Labs ».
      # On normalise UNE seule fois : $IMAGE est ensuite vu par toutes les étapes
      # du job via GITHUB_ENV — build, Trivy et push utilisent la même valeur.
      - name: Normalisation du nom d'image
        run: |
          echo "IMAGE=${REGISTRY}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Construction de l'image Docker
        run: |
          docker build \
            -t ${IMAGE}:prod-${{ needs.build-test-quality.outputs.version }} \
            -t ${IMAGE}:latest \
            ./api

      # Remplace aquasecurity/trivy-action. Trivy tourne en conteneur ;
      # sa base de vulnérabilités est mise en cache sur la VM pour ne pas
      # être retéléchargée à chaque exécution.
      - name: Analyse de sécurité de l'image (Trivy)
        run: |
          # La base de vulnérabilités (107 Mo) est AMORCÉE UNE FOIS sur la VM,
          # jamais téléchargée pendant un job : sur cette liaison, 107 Mo à 60 Ko/s
          # demandent une demi-heure, et Trivy abandonne au bout de 5 minutes.
          #   docker run --rm -v /home/runner/.trivy-cache:/root/.cache \
          #     aquasec/trivy:latest image --download-db-only --timeout 60m
          if [ ! -f "${TRIVY_CACHE}/trivy/db/trivy.db" ]; then
            echo "::error::Base Trivy absente de ${TRIVY_CACHE}/trivy/db/ — amorcer la base sur la VM (voir commentaire ci-dessus)."
            exit 1
          fi
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${TRIVY_CACHE}":/root/.cache \
            aquasec/trivy:latest image \
              --skip-db-update \
              --pkg-types os \
              --timeout 10m \
              --severity CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --format table \
              ${IMAGE}:latest

      - name: Export du rapport Trivy (livrable)
        if: always()
        run: |
          # La base de vulnérabilités (107 Mo) est AMORCÉE UNE FOIS sur la VM,
          # jamais téléchargée pendant un job : sur cette liaison, 107 Mo à 60 Ko/s
          # demandent une demi-heure, et Trivy abandonne au bout de 5 minutes.
          #   docker run --rm -v /home/runner/.trivy-cache:/root/.cache \
          #     aquasec/trivy:latest image --download-db-only --timeout 60m
          if [ ! -f "${TRIVY_CACHE}/trivy/db/trivy.db" ]; then
            echo "::error::Base Trivy absente de ${TRIVY_CACHE}/trivy/db/ — amorcer la base sur la VM (voir commentaire ci-dessus)."
            exit 1
          fi
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${TRIVY_CACHE}":/root/.cache \
            -v "$PWD":/out \
            aquasec/trivy:latest image \
              --skip-db-update \
              --pkg-types os \
              --timeout 10m \
              --severity CRITICAL,HIGH,MEDIUM \
              --exit-code 0 \
              --format json \
              --output /out/trivy-report.json \
              ${IMAGE}:latest

      - name: Archivage du rapport Trivy
        if: always()
        run: |
          DEST="/home/runner/akiwacu-artifacts/run-${GITHUB_RUN_NUMBER}"
          mkdir -p "$DEST"
          cp trivy-report.json "$DEST"/ 2>/dev/null || echo "aucun rapport"
          echo "Trivy → $DEST/trivy-report.json"

      # PAS docker/login-action — même raison. Un docker login tient en une ligne.
      - name: Connexion à GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Publication de l'image sur GHCR
        run: |
          docker push ${IMAGE}:prod-${{ needs.build-test-quality.outputs.version }}
          docker push ${IMAGE}:latest

  # ─────────────────────────────────────────────────────────────
  # 2 bis. Image du client React
  # ─────────────────────────────────────────────────────────────
  client-build-push:
    name: Build et publication du client React
    # Le client React n'existe pas encore (client/ est vide).
    #   gh variable set CLIENT_ENABLED --body true
    needs: build-test-quality
    if: vars.CLIENT_ENABLED == 'true'
    runs-on: [self-hosted, linux, onprem]
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      # Node 20 est PRÉ-INSTALLÉ sur vm-devops-g1 — remplace actions/setup-node.
      - name: Vérification de Node et normalisation du nom d'image
        working-directory: .
        run: |
          node -v && corepack --version
          echo "IMAGE_CLIENT=${REGISTRY}/$(echo '${{ github.repository }}/client' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Installation et build du client
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      - name: Construction de l'image du client
        working-directory: .
        run: docker build -t ${IMAGE_CLIENT}:latest ./client

      - name: Analyse de sécurité de l'image client (Trivy)
        working-directory: .
        run: |
          # La base de vulnérabilités (107 Mo) est AMORCÉE UNE FOIS sur la VM,
          # jamais téléchargée pendant un job : sur cette liaison, 107 Mo à 60 Ko/s
          # demandent une demi-heure, et Trivy abandonne au bout de 5 minutes.
          #   docker run --rm -v /home/runner/.trivy-cache:/root/.cache \
          #     aquasec/trivy:latest image --download-db-only --timeout 60m
          if [ ! -f "${TRIVY_CACHE}/trivy/db/trivy.db" ]; then
            echo "::error::Base Trivy absente de ${TRIVY_CACHE}/trivy/db/ — amorcer la base sur la VM (voir commentaire ci-dessus)."
            exit 1
          fi
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${TRIVY_CACHE}":/root/.cache \
            aquasec/trivy:latest image \
              --skip-db-update \
              --pkg-types os \
              --timeout 10m \
              --severity CRITICAL --ignore-unfixed --exit-code 1 --format table \
              ${IMAGE_CLIENT}:latest

      # PAS docker/login-action — même raison. Un docker login tient en une ligne.
      - name: Connexion à GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Publication de l'image client
        working-directory: .
        run: docker push ${IMAGE_CLIENT}:latest

  # ─────────────────────────────────────────────────────────────
  # 3. Déploiement sur vm-prod-g1 + vérification de démarrage
  # ─────────────────────────────────────────────────────────────
  deploy-vm-prod:
    name: Déploiement automatique sur vm-prod-g1
    # Exige les 3 VM joignables en SSH avec gha_deploy.
    #   gh variable set DEPLOY_ENABLED --body true
    needs: [build-test-quality, docker-build-scan-push, client-build-push]
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, linux, onprem]
    environment: production          # exige un relecteur dans les réglages du dépôt

    steps:
      - uses: actions/checkout@v4

      # PAS webfactory/ssh-agent : le runner purge _actions/ à chaque job,
      # l'action serait retéléchargée à chaque exécution — exactement ce qui
      # faisait échouer docker/login-action et upload-artifact. Écrire une clé
      # dans un fichier tient en trois lignes et ne dépend de rien.
      - name: Chargement de la clé SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY_PROD }}" > ~/.ssh/gha_deploy
          chmod 600 ~/.ssh/gha_deploy

      - name: Ajout de vm-prod-g1 aux hôtes connus
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST_PROD }} >> ~/.ssh/known_hosts

      - name: Copie du docker-compose
        run: |
          scp -i ~/.ssh/gha_deploy docker-compose.prod.yml \
            ${{ secrets.SSH_USER_PROD }}@${{ secrets.SSH_HOST_PROD }}:~/akiwacu/docker-compose.yml

      - name: Déploiement de l'application
        run: |
          ssh -i ~/.ssh/gha_deploy ${{ secrets.SSH_USER_PROD }}@${{ secrets.SSH_HOST_PROD }} << 'EOF'
            set -e
            cd ~/akiwacu
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD_PROD }}'
            export JWT_SECRET='${{ secrets.JWT_SECRET_PROD }}'
            export IMAGE_TAG='latest'
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
          EOF

      - name: Vérification du bon démarrage de l'application
        run: |
          echo "Attente du démarrage (max 120 s)…"
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://${{ secrets.SSH_HOST_PROD }}:8080/actuator/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Application démarrée et saine sur vm-prod-g1"
              curl -s http://${{ secrets.SSH_HOST_PROD }}:8080/actuator/health
              exit 0
            fi
            echo "  tentative $i/24 — statut $STATUS"
            sleep 5
          done
          echo "❌ L'application n'a pas démarré correctement"
          ssh -i ~/.ssh/gha_deploy ${{ secrets.SSH_USER_PROD }}@${{ secrets.SSH_HOST_PROD }} \
            'cd ~/akiwacu && docker compose logs --tail=100 api'
          exit 1

      # La clé ne survit pas au job : le runner est une machine persistante,
      # partagée par cinq personnes et par tous les workflows du dépôt.
      - name: Effacement de la clé SSH
        if: always()
        run: rm -f ~/.ssh/gha_deploy
