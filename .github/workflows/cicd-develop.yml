# Pipeline CI/CD — branche develop → VM-DEV
# Implémente exactement la séquence exigée par l'énoncé §11.2.
# Toute étape en échec interrompt le pipeline : le déploiement n'a lieu
# que si TOUTES les étapes précédentes sont validées.
#
# Tourne sur le runner auto-hébergé (VM-CI) car les étapes SonarQube et
# déploiement SSH doivent joindre le LAN de l'université (voir playbook §3.2).

name: CI/CD develop → VM-DEV

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api
  JAVA_VERSION: '21'

concurrency:
  group: develop-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────────────────────────────────────
  # 1. Build · tests · couverture · qualité
  # ─────────────────────────────────────────────────────────────
  build-test-quality:
    name: Build, tests, couverture et qualité
    runs-on: [self-hosted, linux, onprem]
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # requis par SonarQube pour la blame

      - name: Installation de Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compilation complète du projet Maven
        run: ./mvnw -B clean compile

      - name: Exécution de l'ensemble des tests unitaires
        run: ./mvnw -B test

      - name: Génération du rapport de couverture (JaCoCo)
        run: ./mvnw -B jacoco:report jacoco:check

      - name: Publication du rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 30

      - name: Analyse de la qualité du code (SonarQube)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          ./mvnw -B sonar:sonar \
            -Dsonar.projectKey=akiwacu \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Validation du Quality Gate SonarQube
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Calcul de la version d'image
        id: version
        run: echo "version=$(date +%Y%m%d)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────
  # 2. Image Docker · sécurité · publication
  # ─────────────────────────────────────────────────────────────
  docker-build-scan-push:
    name: Image Docker, analyse Trivy et publication GHCR
    needs: build-test-quality
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, onprem]
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Construction de l'image Docker
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ needs.build-test-quality.outputs.version }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop \
            .

      - name: Analyse de sécurité de l'image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop
          format: table
          exit-code: '1'              # interrompt le pipeline
          severity: 'CRITICAL'        # passer à 'CRITICAL,HIGH' une fois stabilisé
          ignore-unfixed: true

      - name: Export du rapport Trivy (livrable)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop
          format: 'json'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Publication du rapport Trivy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          retention-days: 30

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication de l'image sur GHCR
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ needs.build-test-quality.outputs.version }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop

  # ─────────────────────────────────────────────────────────────
  # 3. Déploiement sur VM-DEV + vérification de démarrage
  # ─────────────────────────────────────────────────────────────
  deploy-vm-dev:
    name: Déploiement automatique sur VM-DEV
    needs: [build-test-quality, docker-build-scan-push]
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, onprem]
    environment: development

    steps:
      - uses: actions/checkout@v4

      - name: Chargement de la clé SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY_DEV }}

      - name: Ajout de VM-DEV aux hôtes connus
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST_DEV }} >> ~/.ssh/known_hosts

      - name: Copie du docker-compose
        run: |
          scp docker-compose.dev.yml \
            ${{ secrets.SSH_USER_DEV }}@${{ secrets.SSH_HOST_DEV }}:~/akiwacu/docker-compose.yml

      - name: Déploiement de l'application
        run: |
          ssh ${{ secrets.SSH_USER_DEV }}@${{ secrets.SSH_HOST_DEV }} << 'EOF'
            set -e
            cd ~/akiwacu
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD_DEV }}'
            export JWT_SECRET='${{ secrets.JWT_SECRET_DEV }}'
            export IMAGE_TAG='develop'
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
          EOF

      - name: Vérification du bon démarrage de l'application
        run: |
          echo "Attente du démarrage (max 120 s)…"
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://${{ secrets.SSH_HOST_DEV }}:8080/actuator/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Application démarrée et saine sur VM-DEV"
              curl -s http://${{ secrets.SSH_HOST_DEV }}:8080/actuator/health
              exit 0
            fi
            echo "  tentative $i/24 — statut $STATUS"
            sleep 5
          done
          echo "❌ L'application n'a pas démarré correctement"
          ssh ${{ secrets.SSH_USER_DEV }}@${{ secrets.SSH_HOST_DEV }} \
            'cd ~/akiwacu && docker compose logs --tail=100 api'
          exit 1
