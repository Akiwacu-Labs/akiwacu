# Prometheus — scrape de l'API Spring Boot (Actuator + Micrometer)
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    projet: akiwacu

scrape_configs:
  - job_name: 'akiwacu-api-dev'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['192.168.0.50:8080']
        labels: { environnement: 'dev' }

  - job_name: 'akiwacu-api-prod'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['192.168.0.51:8080']
        labels: { environnement: 'prod' }

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['192.168.0.50:9100', '192.168.0.51:9100']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
