# Inventaire Akiwacu — 3 VM réelles sur le Proxmox de l'université.
# Toute mention de vm-ci ou vm-mon serait un résidu de l'ancien plan à 4 VM.
all:
  vars:
    ansible_user: deployer
    ansible_ssh_private_key_file: ~/.ssh/gha_deploy
    ansible_python_interpreter: /usr/bin/python3

  children:
    # Les deux environnements applicatifs exigés par l'énoncé
    app:
      hosts:
        vm-dev-g1:
          ansible_host: 192.168.0.50
          env: dev
        vm-prod-g1:
          ansible_host: 192.168.0.51
          env: prod

    # Machine d'outillage : runner GitHub + SonarQube + Prometheus + Grafana
    devops:
      hosts:
        vm-devops-g1:
          ansible_host: 192.168.0.52
