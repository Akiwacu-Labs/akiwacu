server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback SPA — sans cette ligne, un rechargement sur /tontines renvoie 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # L'API est jointe via le réseau Docker interne, pas via l'IP de la VM
    location /api/ {
        proxy_pass         http://api:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs   { proxy_pass http://api:8080/v3/api-docs; }
    location /swagger-ui    { proxy_pass http://api:8080/swagger-ui; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
