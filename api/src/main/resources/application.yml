# PROPRIÉTAIRE : Andy — personne d'autre ne modifie ce fichier.
spring:
  application:
    name: akiwacu
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/akiwacu}
    username: ${DB_USER:akiwacu}
    password: ${DB_PASSWORD:akiwacu}
  jpa:
    hibernate:
      ddl-auto: validate      # JAMAIS update : c'est Flyway qui fait le schéma
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: akiwacu

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

akiwacu:
  jwt:
    secret: ${JWT_SECRET:dev-secret-a-remplacer-par-un-secret-de-256-bits-minimum}
    expiration-minutes: 120

logging:
  level:
    bi.ac.upg.akiwacu: DEBUG
